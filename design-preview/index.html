function home(){return heading('Home','Your family, memories and AI. All in one place.','YOUR PRIVATE FAMILY SPACE')+`<section class="quick-grid" aria-label="Your main areas">${[['Memories','memories','Photos, notes & timeline'],['Family','family','People & shared space'],['My Vault','lock','Personal & private']].map(([n,i,t])=>`<button class="area-tile" data-nav="${n}"><span class="area-icon">${icon(i)}</span><span><b>${n}</b><small>${t}</small></span>${icon('arrow')}</button>`).join('')}</section><div class="home-workspace"><section class="ai-home panel"><div class="section-head"><div class="ai-heading"><span class="ai-icon">${icon('spark')}</span><div><h2>Family AI</h2><p>Your assistant, with access you control.</p></div></div><button class="link" data-nav="Family AI" aria-label="Open Family AI">Open ${icon('arrow')}</button></div><form id="home-ai-form" class="ask-box"><label class="sr-only" for="home-ai-question">Ask Family AI</label><input id="home-ai-question" placeholder="Ask about a memory or family moment…" maxlength="1000"><button type="submit" class="primary" aria-label="Open question in Family AI">${icon('arrow')}</button></form><div class="suggestions"><button data-prompt="Find a family memory">Find a memory</button><button data-prompt="Help me organise family memories">Organise memories</button></div><div class="ai-home-foot"><span>${icon('lock')}${aiScopes.length===1&&aiScopes[0]==='Family collection'?'Family collection only':aiScopes.length+' preview sources'}</span><button class="link" data-access>Manage access</button></div><div class="home-builder-entry"><button class="link" data-new-agent>${icon('plus')} Create agent</button><span>Instructions · photos · files · Drive</span></div><p class="fine prototype-note">Preview · AI isn’t connected yet.</p></section><section class="recent-panel panel"><div class="section-head"><h2>Recent memories</h2><button class="link" data-nav="Memories">View all ${icon('arrow')}</button></div><div class="recent-list">${items.filter(x=>x.scope==='Family').slice(0,3).map(compactRow).join('')}</div></section></div><section class="family-strip panel"><div><h3>Your family</h3><p class="fine">Illustrative profiles</p></div><div class="people">${['Umer','Sara','Salhan','Hasn','Esa','Aileen'].map((n,i)=>`<button class="person" data-person="${n}"><span class="avatar" style="background:${['#e0e7ef','#f0e5db','#e7e8dc','#e0e9e3','#e8e2f0','#f1e1e2'][i]}">${n[0]}</span>${n}</button>`).join('')}</div><button class="link" data-nav="Family">Family ${icon('arrow')}</button></section>`}
function aiPage(){if(aiTab==='Builder')return agentBuilder();return `<div class="heading"><div><p class="kicker">YOUR FAMILY ASSISTANT</p><h1>Family AI</h1><p class="sub">Ask, find and organise. You choose what it can access.</p></div><button class="primary" data-new-agent>${icon('plus')} Create agent</button></div>${aiNavigation()}<div class="ai-workspace"><section class="agent-main panel"><div class="agent-topline"><span class="ai-heading"><span class="ai-icon">${icon('spark')}</span><b class="agent-name-desktop">${escape(activeAgent)}</b><select id="active-agent" aria-label="Active AI agent">${agentNames().map(n=>`<option ${activeAgent===n?'selected':''}>${escape(n)}</option>`).join('')}</select></span><span class="preview-badge">Not connected</span></div><div class="scope-summary">${icon('lock')}<span>Preview access: ${aiScopes.length?aiScopes.map(escape).join(', '):'No sources selected'}</span></div><div class="conversation"><div class="assistant-intro"><h2>What would you like help with?</h2><p>Find a moment, organise your memories or build a story from the sources you approve.</p></div>${aiMessage?`<div class="user-bubble">${escape(aiMessage)}</div><div class="assistant-bubble">${icon('spark')}<div><b>Question previewed, not sent.</b><p>No model is connected. Your question and access choices stay in this browser preview; no files have been read or changed.</p></div></div>`:`<div class="prompt-grid">${['Find a family memory','Help me organise family memories','Build a story from selected memories'].map(t=>`<button data-prompt="${t}">${icon('spark')}${t}${icon('arrow')}</button>`).join('')}</div>`}</div><form id="agent-form" class="agent-composer"><label class="sr-only" for="agent-question">Your question</label><textarea id="agent-question" placeholder="Ask Family AI…" maxlength="1000" required>${escape(aiQuestion)}</textarea><div><span class="fine">Preview only · nothing sent</span><button class="primary" type="submit">Preview question ${icon('arrow')}</button></div></form></section><aside class="agent-side"><section class="panel"><div class="section-head"><h2>Your agents</h2><button class="link" data-new-agent aria-label="Create draft agent">${icon('plus')}</button></div>${agentNames().map((a,i)=>`<button class="agent-choice ${activeAgent===a?'selected':''}" data-agent="${escape(a)}" aria-pressed="${activeAgent===a}"><span class="area-icon">${icon(i===0?'spark':i===1?'memories':'file')}</span><span><b>${escape(a)}</b><small>${i===0?'General assistant':'Example draft'}</small></span></button>`).join('')}</section><section class="panel source-panel"><div class="section-head"><h2>Sources & access</h2><button class="link" data-access>Edit</button></div><p class="fine">${aiScopes.length?aiScopes.map(escape).join(' · '):'No sources approved'}.</p><div class="private-note">${icon('lock')}${aiScopes.includes('My Vault')?'My Vault is selected in this preview. You can remove it in Access.':'My Vault is excluded unless you explicitly select it.'}</div><p class="fine">Device connections and model settings will be connected during implementation.</p></section></aside></div>`}
function aiNavigation(){return `<div class="ai-navigation"><div class="segmented"><button data-aitab="Chat" class="${aiTab==='Chat'?'active':''}">Chat</button><button data-aitab="Builder" class="${aiTab==='Builder'?'active':''}">Agent builder</button></div><button class="link" ${aiTab==='Builder'?'data-buildertab="Sources & access"':'data-access'}>${icon('lock')} Access</button></div>`}
function agentBuilder(){return `<div class="heading"><div><p class="kicker">BUILD YOUR FAMILY AI</p><h1>Agent builder</h1><p class="sub">Instructions, knowledge and permissions.</p></div><button class="primary" data-save-agent>Save draft</button></div>${aiNavigation()}<div class="builder-tabs" role="tablist" aria-label="Agent configuration">${['Instructions','Sources & access','Review'].map(t=>`<button role="tab" aria-selected="${builderTab===t}" data-buildertab="${t}" class="${builderTab===t?'active':''}">${t}</button>`).join('')}</div>${builderNotice?`<p class="builder-notice" role="status">${escape(builderNotice)}</p>`:''}<div class="builder-layout"><section class="panel builder-content">${builderTab==='Instructions'?`<h2>Teach your agent how to help</h2><p class="fine">System instructions guide behaviour. They do not fine-tune or train a model.</p><div class="form"><label>Agent name<input id="agent-name" maxlength="80" value="${escape(agentDraft.name)}" placeholder="e.g. Family memory keeper"></label><label>Purpose<input id="agent-purpose" maxlength="250" value="${escape(agentDraft.purpose)}" placeholder="What should this agent help your family with?"></label><label>System prompt / instructions<textarea id="agent-system-prompt" maxlength="12000" placeholder="Describe its role, tone, tasks, boundaries and when it must ask for approval.">${escape(agentDraft.prompt)}</textarea></label></div><div class="instruction-example"><b>Useful instructions include</b><p>Use only approved sources. Link answers to originals. Ask when uncertain. Never share private content or act without approval.</p></div><div class="actions"><button class="primary" data-buildertab="Sources & access">Choose sources ${icon('arrow')}</button></div>`:builderTab==='Sources & access'?`<h2>Knowledge & source access</h2><p class="fine">Select only what this agent needs. All connectors below are <b>not connected</b>; no device or Drive permissions are requested in this preview.</p><div class="connector-list">${sourceNames.map(n=>{const on=agentDraft.sources.includes(n);return `<article class="connector"><label><input type="checkbox" data-source="${n}" ${on?'checked':''}><span class="area-icon">${icon(n==='Photos'?'memories':n==='My Vault'?'lock':'file')}</span><span class="connector-title"><b>${n}</b><small>${n==='My Vault'?'Private · opt-in only':n==='Google Drive'?'Choose individual files or folders':n==='Photos'?'Choose photos or albums':'Selected items only'}</small></span><span class="preview-badge">Not connected</span></label>${on?`<div class="source-selection"><label>Planned selection <input data-selection="${n}" value="${escape(agentDraft.selections[n]||'')}" placeholder="${n==='Google Drive'?'e.g. Family documents folder':n==='Photos'?'e.g. Summer album':'Describe the exact items to approve'}"></label><p class="fine">Preview selection only · no access granted</p><span class="read-only">Read selected items only · no write or delete access</span></div>`:''}</article>`}).join('')}</div><div class="actions"><button class="secondary" data-buildertab="Instructions">Back</button><button class="primary" data-buildertab="Review">Review access ${icon('arrow')}</button></div>`:`<h2>Review your agent</h2><dl class="agent-review"><dt>Name</dt><dd>${escape(agentDraft.name||'Not set')}</dd><dt>Purpose</dt><dd>${escape(agentDraft.purpose||'Not set')}</dd><dt>System prompt</dt><dd class="review-prompt">${escape(agentDraft.prompt||'Not set')}</dd><dt>Requested sources</dt><dd>${agentDraft.sources.length?agentDraft.sources.map(n=>`<p><b>${n}</b> — ${escape(agentDraft.selections[n]||'No selection described')}</p>`).join(''):'None selected'}</dd></dl><div class="scope">${icon('lock')}Read-only knowledge access. Sharing, sending, edits and deletions are not enabled.</div><label class="approval-rule"><input type="checkbox" checked disabled> Require approval before any future action</label><p class="fine">Saving creates a browser-session draft, not an active AI. No model call, training, source connection or data upload occurs.</p><div class="actions"><button class="secondary" data-buildertab="Sources & access">Back</button><button class="primary" data-save-agent>Save draft</button></div>`}</section><aside class="builder-aside"><section class="panel"><h2>Your agent drafts</h2><p class="fine">Create, reopen and edit. Reset on refresh.</p>${agentDrafts.length?agentDrafts.map(a=>`<button class="draft-entry" data-editagent="${a.id}">${icon('spark')}<span><b>${escape(a.name)}</b><small>${a.sources.length} requested sources · not active</small></span>${icon('arrow')}</button>`).join(''):'<p class="fine">No saved drafts yet.</p>'}<button class="link" data-new-agent>${icon('plus')} Create another agent</button></section><section class="panel"><h3>Private by default</h3><p class="fine">No sources are preselected. Google Drive must use a real OAuth connection and scoped file selection when implemented. Credentials do not belong in the system prompt.</p></section></aside></div>`}
function bindBuilder(){[['#agent-name','name'],['#agent-purpose','purpose'],['#agent-system-prompt','prompt']].forEach(([sel,key])=>document.querySelector(sel)?.addEventListener('input',e=>{agentDraft[key]=e.target.value;builderNotice='';document.querySelector('.builder-notice')?.remove()}));document.querySelectorAll('[data-source]').forEach(el=>el.addEventListener('change',e=>{const n=e.target.dataset.source;agentDraft.sources=e.target.checked?[...agentDraft.sources,n]:agentDraft.sources.filter(s=>s!==n);render()}));document.querySelectorAll('[data-selection]').forEach(el=>el.addEventListener('input',e=>agentDraft.selections[e.target.dataset.selection]=e.target.value))}
function saveAgentDraft(){if(!agentDraft.name.trim()||!agentDraft.prompt.trim()){builderNotice='Add an agent name and system instructions before saving.';builderTab='Instructions';render();document.querySelector(!agentDraft.name.trim()?'#agent-name':'#agent-system-prompt')?.focus();return}const id=editingId||'agent-'+Date.now();const saved=structuredClone({...agentDraft,id,name:agentDraft.name.trim()});agentDrafts=agentDrafts.filter(a=>a.id!==id);agentDrafts.push(saved);editingId=id;agentDraft=saved;builderNotice='Draft saved in this preview. Not active; no sources connected. You can reopen it below.';builderTab='Review';render()}

function accessDialog(){openDialog('AI access',`<p class="detail-copy">Choose the sources for this design preview. These choices do not grant real access.</p><form id="access-form" class="scope-form">${['Family collection','Selected memories','My Vault'].map(n=>`<label><input type="checkbox" value="${n}" ${aiScopes.includes(n)?'checked':''}><span><b>${n}</b><small>${n==='My Vault'?'Private · explicit opt-in required':'Only material you are allowed to access'}</small></span>${icon(n==='My Vault'?'lock':'memories')}</label>`).join('')}<p class="fine">Tags and family relationships never grant access. You can deselect any source.</p><div class="actions"><button type="button" class="secondary" data-close>Cancel</button><button type="submit" class="primary">Apply to preview</button></div></form>`);document.querySelector('#access-form').onsubmit=e=>{e.preventDefault();aiScopes=[...e.target.querySelectorAll('input:checked')].map(x=>x.value);dialog.close();render()}}

function collection(){const priv=page==='My Vault';const list=items.filter(x=>x.scope===(priv?'Private':'Family')).filter(x=>filter==='All types'||x.type===filter).filter(x=>(x.title+' '+x.person+' '+x.caption).toLowerCase().includes(query.toLowerCase()));return heading(priv?'Just for you.':'Your family story.',priv?'Your own space. Nothing shared unless you choose.':'Big milestones. Small moments. Everything worth keeping.',priv?'MY VAULT · ONLY YOU':'MEMORIES · SAMPLE FAMILY COLLECTION')+`<div class="toolbar"><div class="segmented" aria-label="Collection view"><button data-view="Grid" class="${view==='Grid'?'active':''}" aria-pressed="${view==='Grid'}">Browse</button><button data-view="Timeline" class="${view==='Timeline'?'active':''}" aria-pressed="${view==='Timeline'}">Timeline</button></div><select id="filter" aria-label="Memory type">${['All types','Photo','Voice note','Note'].map(v=>`<option ${filter===v?'selected':''}>${v}</option>`).join('')}</select></div><section class="collection ${view==='Timeline'?'timeline':''}">${list.length?`<div class="cards">${list.map(card).join('')}</div>`:`<div class="empty">${icon('search')}<h2>No memories found</h2><p>Try another search or add a memory to this preview.</p><button class="secondary" id="clear">Clear filters</button></div>`}</section>`}
let familyTab='Chat',familyDraft='',familyMessages=[],chatAgents=['Family AI'],chatTarget='Everyone',chatMode='Mention only';
function family(){return `<div class="heading"><div><h1>Family</h1><p class="sub">People and AI, in one shared conversation.</p></div><button class="secondary" data-chat-members>${icon('family')} Members</button></div><div class="ai-navigation"><div class="segmented"><button data-familytab="Chat" class="${familyTab==='Chat'?'active':''}">Chat</button><button data-familytab="People" class="${familyTab==='People'?'active':''}">People</button></div><button class="link" data-chat-members>${icon('spark')} Manage agents</button></div>${familyTab==='People'?`<div class="family-grid">${['Umer','Sara','Salhan','Hasn','Esa','Aileen'].map(n=>`<article class="family-profile"><span class="avatar">${n[0]}</span><h2>${n}</h2><p>Illustrative family profile</p><button class="link" data-person="${n}">View memories</button></article>`).join('')}</div>`:`<section class="panel family-chat"><header class="family-chat-head"><div><h2>Family conversation</h2><p class="fine">Sample household · messages are visible to this shared space</p></div><span class="preview-badge">Preview only</span></header><div class="chat-participants"><span class="human-members">${icon('family')} Family members</span>${chatAgents.map(a=>`<button data-mention="${escape(a)}">${icon('spark')}${escape(a)} <small>AI</small></button>`).join('')}<button data-chat-members aria-label="Add an agent to chat">${icon('plus')} Agent</button></div><div class="chat-policy">${icon('lock')}<span>${chatMode==='Mention only'?'Agents respond only when mentioned.':'Agents may suggest replies for human review.'} Chat membership does not grant access to photos, files, Drive or private vaults.</span></div><div class="family-messages" role="log" aria-label="Family conversation"><p class="chat-example-label">ILLUSTRATIVE CONVERSATION · NOT LIVE</p><article class="family-message"><span class="avatar">SA</span><div><b>Sara <small>Person · sample</small></b><p>Can we put the memories from our trip together?</p></div></article><article class="family-message"><span class="avatar">UH</span><div><b>Umer <small>Person · sample</small></b><p>@Family AI, suggest an album using only the memories shared here.</p></div></article><article class="family-message ai-message"><span class="ai-icon">${icon('spark')}</span><div><b>Family AI <em>AI AGENT</em><small>Illustrative reply</small></b><p>I can suggest an album from approved shared memories. Anything in a private vault or an unapproved source stays out.</p><span class="source-label">Example scope: approved Family collection</span></div></article>${familyMessages.map(m=>`<article class="family-message"><span class="avatar">UH</span><div><b>You <small>Local preview · to ${escape(m.to)}</small></b><p>${escape(m.body)}</p>${m.to!=='Everyone'?'<span class="source-label">Not sent to an AI. No model connected.</span>':''}</div></article>`).join('')}</div><form id="family-chat-form" class="agent-composer"><label class="chat-recipient">Reply to<select id="chat-target"><option>Everyone</option>${chatAgents.map(a=>`<option ${chatTarget===a?'selected':''}>${escape(a)}</option>`).join('')}</select><span>AI requests stay visible in this chat</span></label><label class="sr-only" for="family-chat-input">Message your family or mention an AI agent</label><textarea id="family-chat-input" required maxlength="3000" placeholder="Message your family or ask an agent…">${escape(familyDraft)}</textarea><div><button type="button" class="link" data-chat-attachment>${icon('plus')} Attach</button><span class="fine">Local preview only</span><button class="primary" type="submit">Add message ${icon('arrow')}</button></div></form></section>`}`}
function chatMembers(){openDialog('People & AI in this chat',`<p class="fine">Illustrative family members: Umer, Sara, Salhan, Hasn, Esa and Aileen. No invitations are sent from this prototype.</p><h3>AI participants</h3><p class="fine">Select agents to show in this chat. Drafts are not activated or connected by doing this.</p><form id="chat-members-form" class="scope-form">${agentNames().map(a=>`<label><input type="checkbox" value="${escape(a)}" ${chatAgents.includes(a)?'checked':''}><span><b>${escape(a)}</b><small>AI agent · not connected</small></span>${icon('spark')}</label>`).join('')}<label>Participation<select id="chat-mode"><option ${chatMode==='Mention only'?'selected':''}>Mention only</option><option ${chatMode!=='Mention only'?'selected':''}>Suggestions with review</option></select></label><p class="fine">Removing an agent removes it from the preview participant list. Source access remains a separate agent setting; membership never grants private access. Automatic sending or external actions are not enabled.</p><div class="actions"><button type="button" class="secondary" data-close>Cancel</button><button class="primary">Apply to preview</button></div></form>`);document.querySelector('#chat-members-form').onsubmit=e=>{e.preventDefault();chatAgents=[...e.target.querySelectorAll('input:checked')].map(x=>x.value);chatMode=document.querySelector('#chat-mode').value;if(!chatAgents.includes(chatTarget))chatTarget='Everyone';dialog.close();render()}}
function bindFamilyChat(){document.querySelector('#family-chat-input')?.addEventListener('input',e=>familyDraft=e.target.value);document.querySelector('#chat-target')?.addEventListener('change',e=>chatTarget=e.target.value);document.querySelector('#family-chat-form')?.addEventListener('submit',e=>{e.preventDefault();const body=familyDraft.trim();if(!body)return;familyMessages.push({body,to:chatTarget});familyDraft='';render();const log=document.querySelector('.family-messages');log.scrollTop=log.scrollHeight;document.querySelector('#family-chat-input').focus()})}

function bindAI(){bindBuilder();bindFamilyChat();document.querySelector('#active-agent')?.addEventListener('change',e=>{activeAgent=e.target.value;aiMessage='';render()});document.querySelector('#home-ai-form')?.addEventListener('submit',e=>{e.preventDefault();aiQuestion=document.querySelector('#home-ai-question').value;aiMessage='';navigate('Family AI');document.querySelector('#agent-question').focus()});document.querySelector('#agent-form')?.addEventListener('submit',e=>{e.preventDefault();const q=document.querySelector('#agent-question').value.trim();if(!q)return;aiMessage=q;aiQuestion='';render();document.querySelector('.assistant-bubble')?.scrollIntoView({block:'nearest'})})}
function render(){document.querySelectorAll('.nav,.mobile-nav').forEach(n=>n.innerHTML=navs.map(([p,i])=>`<button data-nav="${p}" class="${page===p?'active':''}" ${page===p?'aria-current="page"':''}>${icon(i)}<span>${p}</span></button>`).join(''));document.querySelector('#content').innerHTML=(page==='Home'?home():page==='Family AI'?aiPage():page==='Family'?family():collection())+`<p class="footer-note">${icon('lock')}Design preview only. Stock imagery and sample records. Changes last until this page is refreshed.</p>`;bindAI();document.querySelector('#filter')?.addEventListener('change',e=>{filter=e.target.value;render()});document.querySelector('#clear')?.addEventListener('click',()=>{filter='All types';query='';document.querySelector('#search').value='';render()})}
const dialog=document.querySelector('#dialog');function openDialog(title,body){if(!dialog.open)returnFocus=document.activeElement;dialog.innerHTML=`<div class="dialog-head"><h2>${title}</h2><button data-close aria-label="Close dialog">${icon('close')}</button></div><div class="dialog-body">${body}</div>`;dialog.setAttribute('aria-label',title);if(!dialog.open)dialog.showModal()}dialog.addEventListener('close',()=>{if(returnFocus?.isConnected)returnFocus.focus()});dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});
function detail(id){const x=items.find(x=>x.id===id);openDialog('A moment to keep',`${image(x,'detail-img')}<h2 class="detail-title">${escape(x.title)}</h2><p class="detail-copy">${escape(x.caption)}</p><div class="scope">${icon(x.scope==='Private'?'lock':'family')}<span>${x.scope==='Private'?'Only you · My Vault':'Sample Family collection · shared destination'}<br>This preview does not change real permissions.</span></div><div class="detail-meta"><span>Date</span><b>${escape(x.date)}</b><span>People</span><b>${escape(x.person)}</b><span>Source</span><b>${escape(x.source)}</b></div><p class="fine">${x.type==='Voice note'?'Audio playback is not connected in this visual prototype.':'Images and records are illustrative, not actual family memories.'}</p><div class="actions"><button class="secondary" data-close>Done</button></div>`)}
function capture(){if(step===1){openDialog('Add a memory',`<p class="fine" style="margin-top:0">STEP 1 OF 2 · YOUR MEMORY</p><div class="types">${[['Note','file'],['Photo','memories'],['Voice note','voice']].map(([t,i])=>`<button data-type="${t}" class="${draft.type===t?'selected':''}" aria-pressed="${draft.type===t}">${icon(i)}${t}</button>`).join('')}</div><p class="fine">${draft.type==='Note'?'Try saving a note in this preview.':'Visual flow only. Device upload and recording are not connected.'}</p><form class="form" id="capture-form"><label>Give it a name<input id="draft-title" required maxlength="120" placeholder="A moment worth keeping" value="${escape(draft.title)}"></label><label>The little details <span style="font-weight:400">Optional</span><textarea id="draft-note" placeholder="What would you like to remember?">${escape(draft.note)}</textarea></label><label>Save to<select id="draft-scope"><option value="Private" ${draft.scope==='Private'?'selected':''}>My Vault · only you</option><option value="Family" ${draft.scope==='Family'?'selected':''}>Family · shared collection</option></select></label><div class="actions"><button type="button" class="secondary" data-close>Not now</button><button class="primary" type="submit">Review memory ${icon('arrow')}</button></div></form>`);document.querySelector('#capture-form').onsubmit=e=>{e.preventDefault();syncDraft();if(!draft.title.trim()){document.querySelector('#draft-title').setCustomValidity('Add a title to continue.');document.querySelector('#draft-title').reportValidity();return}step=2;capture()};document.querySelector('#draft-title').oninput=e=>e.target.setCustomValidity('')}else{openDialog('One last look',`<p class="fine" style="margin-top:0">STEP 2 OF 2 · REVIEW</p><h2 class="detail-title">${escape(draft.title)}</h2><p class="detail-copy">${escape(draft.note||'No additional details.')}</p><div class="scope">${icon(draft.scope==='Private'?'lock':'family')}<span><b>${draft.scope==='Private'?'My Vault · only you':'Family · shared collection'}</b><br>${draft.scope==='Private'?'Not added to your shared family collection.':'This is a shared destination. No real sharing occurs in this preview.'}</span></div><p class="fine">${escape(draft.type)} · Preview only. No upload, recording, AI processing or database save will occur.</p><div class="actions"><button class="secondary" id="back">Back</button><button class="primary" id="save">Add to preview</button></div>`);document.querySelector('#back').onclick=()=>{step=1;capture()};document.querySelector('#save').onclick=()=>{const item={id:Date.now(),title:draft.title.trim(),caption:draft.note||'Added in this design preview.',scope:draft.scope,type:draft.type,date:'This preview',person:'You',source:'Temporary browser-session sample'};items.unshift(item);page=draft.scope==='Private'?'My Vault':'Memories';query='';document.querySelector('#search').value='';filter='All types';render();openDialog('Added to your preview',`<div class="success">${icon('check')}<h2>A little moment, kept.</h2><p>“${escape(item.title)}” is now in ${item.scope==='Private'?'My Vault':'the Family collection'}<br>for this preview only.</p><p class="fine">It will disappear when you refresh. Nothing was uploaded or shared.</p><button class="primary" data-close>View collection</button></div>`);draft={title:'',note:'',scope:'Private',type:'Note'};step=1;returnFocus=document.querySelector('[data-add]')}}}
function syncDraft(){const t=document.querySelector('#draft-title');if(t){draft.title=t.value;draft.note=document.querySelector('#draft-note').value;draft.scope=document.querySelector('#draft-scope').value}}
dialog.addEventListener('cancel',syncDraft);document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.nav)navigate(b.dataset.nav);if(b.dataset.familytab){familyTab=b.dataset.familytab;render()}if(b.hasAttribute('data-chat-members'))chatMembers();if(b.dataset.mention){chatTarget=b.dataset.mention;render();document.querySelector('#family-chat-input').focus()}if(b.hasAttribute('data-chat-attachment'))openDialog('Share an attachment',`<p class="detail-copy">Photos, documents and files shared here will be visible to the chat’s authorised members. AI use requires separate source approval.</p><p class="fine">Uploads are not connected in this prototype. No file was selected or shared.</p><button class="secondary" data-close>Done</button>`);if(b.dataset.prompt){aiQuestion=b.dataset.prompt;aiMessage='';navigate('Family AI');document.querySelector('#agent-question').focus()}if(b.dataset.agent){activeAgent=b.dataset.agent;aiMessage='';render()}if(b.hasAttribute('data-access'))accessDialog();if(b.hasAttribute('data-new-agent')){editingId=null;agentDraft=freshAgent();builderNotice='';builderTab='Instructions';aiTab='Builder';navigate('Family AI')}if(b.dataset.aitab){aiTab=b.dataset.aitab;page='Family AI';render()}if(b.dataset.buildertab){builderTab=b.dataset.buildertab;render()}if(b.dataset.editagent){const a=agentDrafts.find(x=>x.id===b.dataset.editagent);agentDraft=structuredClone(a);editingId=a.id;builderTab='Instructions';aiTab='Builder';builderNotice='';render()}if(b.hasAttribute('data-save-agent'))saveAgentDraft();if(b.dataset.template){activeAgent=b.dataset.template;dialog.close();page='Family AI';render()}if(b.hasAttribute('data-add')){if(!draft.title&&!draft.note)draft.scope=page==='Memories'||page==='Family'?'Family':'Private';step=1;capture()}if(b.dataset.item)detail(Number(b.dataset.item));if(b.hasAttribute('data-close')){syncDraft();dialog.close()}if(b.dataset.view){view=b.dataset.view;render()}if(b.dataset.type){syncDraft();draft.type=b.dataset.type;capture()}if(b.dataset.person){page='Memories';query=b.dataset.person;document.querySelector('#search').value=query;filter='All types';render()}});
